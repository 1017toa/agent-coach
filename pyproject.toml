[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-coach"
version = "0.1.0"
description = "Grade and coach your Claude Code and Codex prompts from your own conversation history, against Anthropic's and OpenAI's official guides."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []
license = "MIT"
license-files = ["LICENSE"]
keywords = ["claude-code", "codex", "openai-codex", "anthropic", "claude", "prompt-engineering", "prompting", "coaching", "ai-agents", "coding-agents", "agentic-coding", "developer-tools", "cli", "claude-md", "agents-md"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Operating System :: OS Independent",
  "Topic :: Software Development",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Natural Language :: English",
  "Natural Language :: Korean",
]

[project.urls]
Homepage = "https://github.com/1017toa/agent-coach"
Issues = "https://github.com/1017toa/agent-coach/issues"

[project.scripts]
agent-coach = "agentcoach.cli:main"

[tool.setuptools]
packages = ["agentcoach", "agentcoach.rubric"]

[tool.setuptools.package-data]
agentcoach = ["rubric/*.json"]
"agentcoach.rubric" = ["*.json"]
