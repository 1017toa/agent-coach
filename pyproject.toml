[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-coach"
version = "0.1.0"
description = "Personal coach for how you direct Claude Code and Codex, graded against the official guides using your own local transcripts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
agent-coach = "agentcoach.cli:main"

[tool.setuptools]
packages = ["agentcoach"]

[tool.setuptools.package-data]
agentcoach = ["rubric/*.json"]
